name: Maya Android APK

on:
  push:
    branches: [main, maya-android-starter]
    paths:
      - "maya-android/**"
      - ".github/workflows/maya-android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "maya-android/**"
      - ".github/workflows/maya-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract Maya Android source
        run: unzip -q maya-android/Maya-Android-source.zip -d maya-android/source
      - name: Build debug APK
        run: gradle -p maya-android/source --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-apk
          path: maya-android/source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
