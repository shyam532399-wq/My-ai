<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice &amp; Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">
    <header class="w-full max-w-2xl text-center py-4 border-b border-gray-800">
        <h1 class="text-2xl font-bold text-indigo-400">Live AI Assistant</h1>
        <p class="text-xs text-gray-400 mt-1">Realtime Voice (Zero Beep) &amp; Text Mode</p>
    </header>

    <div class="my-6 flex gap-4">
        <button id="liveVoiceBtn" onclick="toggleLiveVoice()" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-full font-semibold transition flex items-center gap-2">
            <span id="voiceIcon">🎙️</span>
            <span id="voiceStatus">Start Live Voice</span>
        </button>
    </div>

    <main class="w-full max-w-2xl flex-1 bg-gray-800 rounded-lg p-4 flex flex-col justify-between overflow-hidden shadow-lg border border-gray-700">
        <div id="chatContainer" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 max-h-[60vh]">
            <div class="bg-gray-700 p-3 rounded-lg max-w-[80%]">
                Hello! Main live voice aur text dono samajh sakta hoon. Kaho, kya madad karoon?
            </div>
        </div>
        <div class="flex gap-2">
            <input type="text" id="userInput" placeholder="Kuch poochhein..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500" onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg font-medium transition">Send</button>
        </div>
    </main>

    <script>
        let ws = null, audioCtx = null, micStream = null, isLive = false;

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage("User", text, "bg-indigo-600 self-end ml-auto");
            input.value = "";

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                if (data.response) appendMessage("AI", data.response, "bg-gray-700");
                else appendMessage("AI", "Error: " + data.error, "bg-red-900");
            } catch (err) {
                appendMessage("AI", "Connection Error", "bg-red-900");
            }
        }

        function appendMessage(sender, text, classes) {
            const container = document.getElementById("chatContainer");
            const msgDiv = document.createElement("div");
            msgDiv.className = `p-3 rounded-lg max-w-[80%] ${classes}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function toggleLiveVoice() {
            const btn = document.getElementById("liveVoiceBtn");
            const status = document.getElementById("voiceStatus");

            if (isLive) {
                if (ws) ws.close();
                if (micStream) micStream.getTracks().forEach(track => track.stop());
                if (audioCtx) await audioCtx.close();
                isLive = false;
                btn.classList.replace("bg-red-600", "bg-indigo-600");
                status.innerText = "Start Live Voice";
                return;
            }

            try {
                const protocol = window.location.protocol === "https:" ? "wss" : "ws";
                ws = new WebSocket(`${protocol}://${window.location.host}/ws/live`);
                ws.binaryType = "arraybuffer";

                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                let nextStartTime = 0;

                ws.onmessage = async (event) => {
                    const audioBuffer = await decodePCM(event.data, audioCtx, 24000);
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(audioCtx.destination);
                    const currentTime = audioCtx.currentTime;
                    if (nextStartTime < currentTime) nextStartTime = currentTime;
                    source.start(nextStartTime);
                    nextStartTime += audioBuffer.duration;
                };

                micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
                const sourceNode = audioCtx.createMediaStreamSource(micStream);
                const processor = audioCtx.createScriptProcessor(2048, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = convertFloat32ToInt16(inputData);
                        ws.send(pcmData.buffer);
                    }
                };

                sourceNode.connect(processor);
                processor.connect(audioCtx.destination);
                isLive = true;
                btn.classList.replace("bg-indigo-600", "bg-red-600");
                status.innerText = "Listening... (Click to Stop)";
            } catch (err) {
                console.error("Mic Access Error:", err);
                alert("Microphone permission zaroori hai!");
            }
        }

        function convertFloat32ToInt16(buffer) {
            let l = buffer.length;
            let buf = new Int16Array(l);
            while (l--) {
                let s = Math.max(-1, Math.min(1, buffer[l]));
                buf[l] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return buf;
        }

        async function decodePCM(arrayBuffer, ctx, sampleRate) {
            const int16Array = new Int16Array(arrayBuffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / (int16Array[i] < 0 ? 0x8000 : 0x7FFF);
            }
            const buffer = ctx.createBuffer(1, float32Array.length, sampleRate);
            buffer.getChannelData(0).set(float32Array);
            return buffer;
        }
    </script>
</body>
</html>
